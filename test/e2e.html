<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>jsbarevi — end-to-end fixture</title>
<style>
  body { background:#1e1e1e; color:#ddd; font:14px/1.5 ui-sans-serif,system-ui; margin:40px; }
  textarea { width:640px; height:150px; background:#252526; color:#eee; border:1px solid #444;
             padding:10px; font:13px/1.5 ui-monospace,Menlo,monospace; border-radius:4px; }
  input { width:640px; background:#252526; color:#eee; border:1px solid #444; padding:8px;
          font:13px/1.5 ui-monospace,Menlo,monospace; border-radius:4px; margin-top:12px; }
  p { color:#8a8a8a; }
</style>
</head>
<body>
<h1>jsbarevi <small id="build" style="font:400 12px ui-monospace,monospace;color:#666"></small></h1>
<p>Real browser, real key events. Press <code>i</code> to type, <code>Esc</code> to leave insert,
<code>:e</code> for the external editor, <code>u</code> to undo.</p>

<textarea id="field" aria-label="fixture composer">alpha beta gamma
delta epsilon
zeta eta theta</textarea>

<input id="single" aria-label="fixture single-line" value="single line input">

<script type="module">
  import { attach } from "../src/entry.js";

  const ta = document.getElementById("field");
  const input = document.getElementById("single");

  // The harness sets this to disable the badge/prompt UI if it gets in the way.
  // `:e` posts here. TextEditAid's own server defaults to 8888; this host's
  // edit-server listens on 31416. Override per field.
  // Default `/edit` is proxied by tools/dev-server.mjs to a real edit-server
  // (127.0.0.1:31416 here). Point it straight at a server only if that server
  // sends CORS headers: ?editor=http://127.0.0.1:31416/
  // In an extension (chrome-extension:// origin, host_permissions) the direct
  // endpoint works with no proxy. Served from a page, it needs either the /edit
  // proxy or the opt-in CORS patch on the server.
  const isExtension = location.protocol === "chrome-extension:";
  const editorUrl = new URLSearchParams(location.search).get("editor")
    || (isExtension ? "http://127.0.0.1:31416/" : "/edit");

  const h1 = attach(ta, { version: "0.1.0", editorUrl });
  const h2 = attach(input, { version: "0.1.0", editorUrl });

  const entry = await import("../src/entry.js");
  // A stale cached page is otherwise indistinguishable from a broken one.
  document.getElementById("build").textContent = entry.BUILD;
  window.jsbarevi = { textarea: h1, single: h2, ready: true, build: entry.BUILD };
</script>
</body>
</html>
